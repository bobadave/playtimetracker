<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game History</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar page-header">
        <div class="menu-wrap">
          <button id="menu-toggle" class="hamburger-btn" type="button" aria-expanded="false" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <nav id="menu-panel" class="menu-panel hidden" aria-label="Main menu">
            <a href="/teams">Teams</a>
            <a id="roster-link" href="/t1/roster">Player Roster</a>
            <a id="games-link" href="/t1/games">Games</a>
          </nav>
        </div>
        <div>
          <p class="eyebrow">Game history</p>
          <h1>Game History</h1>
          <div id="team-name-display" class="game-name-label">Team: --</div>
        </div>
        <div class="header-actions roster-actions">
          <a id="new-game-link" href="/t1/new-game" class="primary-btn">Create New Game</a>
        </div>
      </header>

      <main class="content-panel">
        <div id="games-empty-state" class="empty-state hidden">
          <p>No games yet for this team. Create a new game to get started.</p>
          <a id="empty-games-create-link" href="/t1/new-game" class="primary-btn">Create New Game</a>
        </div>
        <div id="games-list" class="game-list"></div>
        <div class="game-history-footer">
          <button id="unarchive-games-btn" type="button" class="secondary-btn hidden">Unarchive Archived Games</button>
        </div>
      </main>
    </div>

    <script src="/styles.js"></script>
    <script>
      let currentGames = [];
      let editingGameId = null;
      const expandedGameIds = new Set();

      function getCurrentTeamId() {
        const match = window.location.pathname.match(/^\/t(\d+)\/games$/);
        return match ? Number(match[1]) : 1;
      }

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderGameRow(game) {
        const teamId = getCurrentTeamId();
        const href = `/t${teamId}/games/${game.id}`;
        const isActive = Number(game.is_active) === 1;
        const editing = editingGameId === game.id;
        const expanded = editing || expandedGameIds.has(game.id);

        const detailsContent = editing
          ? `
            <div class="field-group">
              <label for="edit-game-name-${game.id}">Name</label>
              <input id="edit-game-name-${game.id}" type="text" class="inline-input edit-name" value="${escapeHtml(game.name || '')}" />
            </div>
            <div class="field-group">
              <label for="edit-game-location-${game.id}">Location</label>
              <input id="edit-game-location-${game.id}" type="text" class="inline-input edit-location" value="${escapeHtml(game.location || '')}" />
            </div>
            <div class="field-group">
              <label for="edit-game-date-${game.id}">Date</label>
              <input id="edit-game-date-${game.id}" type="date" class="inline-input edit-date" value="${escapeHtml(game.date || '')}" />
            </div>
            <div class="field-group">
              <label for="edit-game-status-${game.id}">Status</label>
              <select id="edit-game-status-${game.id}" class="inline-input edit-status">
                <option value="true" ${isActive ? 'selected' : ''}>Active</option>
                <option value="false" ${!isActive ? 'selected' : ''}>Ended</option>
              </select>
            </div>
            <div class="row-actions">
              <button type="button" class="secondary-btn small-btn" data-action="cancel" data-game-id="${game.id}">Cancel</button>
              <button type="button" class="danger-btn small-btn" data-action="archive" data-game-id="${game.id}">Archive</button>
              <button type="button" class="primary-btn small-btn" data-action="update" data-game-id="${game.id}">Update</button>
            </div>
          `
          : `
            <div class="game-row-info">
              <div class="game-row-info-item"><span class="game-row-info-label">Location</span><span>${escapeHtml(game.location || 'TBD')}</span></div>
              <div class="game-row-info-item"><span class="game-row-info-label">Date</span><span>${escapeHtml(game.date || 'TBD')}</span></div>
              <div class="game-row-info-item"><span class="game-row-info-label">Status</span><span>${isActive ? 'Active' : 'Ended'}</span></div>
            </div>
            <div class="row-actions">
              <button type="button" class="secondary-btn small-btn" data-action="edit" data-game-id="${game.id}">Edit</button>
            </div>
          `;

        return `
          <div class="game-row" data-game-id="${game.id}" data-expanded="${expanded}">
            <div class="game-row-summary">
              <button type="button" class="game-row-name-btn" data-action="toggle" data-game-id="${game.id}" aria-expanded="${expanded}">
                <span class="game-row-name">${escapeHtml(game.name || '')}</span>
              </button>
              <div class="game-row-summary-actions">
                <span class="game-status-badge ${isActive ? 'game-status-badge--active' : 'game-status-badge--ended'}">${isActive ? 'Active' : 'Ended'}</span>
                <a href="${href}" class="primary-btn small-btn">View Game</a>
                <button type="button" class="game-row-toggle" data-action="toggle" data-game-id="${game.id}" aria-expanded="${expanded}" aria-label="Show more details">
                  <span class="game-row-chevron" aria-hidden="true">⌄</span>
                </button>
              </div>
            </div>
            <div class="game-row-details">
              <div class="game-row-details-inner">
              ${detailsContent}
              </div>
            </div>
          </div>
        `;
      }

      function renderGamesTable() {
        const list = document.getElementById('games-list');
        const sortedGames = [...currentGames].sort((a, b) => {
          const dateCompare = String(b.date || '').localeCompare(String(a.date || ''));
          if (dateCompare !== 0) {
            return dateCompare;
          }
          return Number(b.id) - Number(a.id);
        });
        list.innerHTML = sortedGames.map(renderGameRow).join('');
      }

      async function updateGame(gameId) {
        const row = document.querySelector(`.game-row[data-game-id="${gameId}"]`);
        const name = row.querySelector('.edit-name').value.trim();
        const location = row.querySelector('.edit-location').value.trim();
        const date = row.querySelector('.edit-date').value;
        const isActive = row.querySelector('.edit-status').value === 'true';

        if (!name || !location || !date) {
          alert('Name, location, and date are required.');
          return;
        }

        const response = await fetch(`/api/games/${gameId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, location, date, isActive })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          alert(errorData.message || 'Unable to update game.');
          return;
        }

        editingGameId = null;
        await loadGames();
      }

      async function archiveGame(gameId) {
        if (!confirm('Archive this game? It will be hidden from the game history list.')) {
          return;
        }

        const response = await fetch(`/api/games/${gameId}/archive`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ archived: true })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          alert(errorData.message || 'Unable to archive game.');
          return;
        }

        editingGameId = null;
        await loadGames();
        await refreshUnarchiveButton();
      }

      async function refreshUnarchiveButton() {
        const teamId = getCurrentTeamId();
        const unarchiveBtn = document.getElementById('unarchive-games-btn');
        if (!unarchiveBtn) {
          return;
        }

        const response = await fetch(`/api/games?teamId=${teamId}&archived=true`);
        if (!response.ok) {
          unarchiveBtn.classList.add('hidden');
          return;
        }

        const { games = [] } = await response.json();
        unarchiveBtn.classList.toggle('hidden', games.length === 0);
      }

      async function unarchiveGames() {
        const teamId = getCurrentTeamId();
        const response = await fetch('/api/games/unarchive', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ teamId })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          alert(errorData.message || 'Unable to unarchive games.');
          return;
        }

        await loadGames();
        await refreshUnarchiveButton();
      }

      function handleGamesListClick(event) {
        const button = event.target.closest('button[data-action]');
        if (!button) {
          return;
        }

        const gameId = Number(button.dataset.gameId);
        const { action } = button.dataset;

        if (action === 'toggle') {
          if (expandedGameIds.has(gameId)) {
            expandedGameIds.delete(gameId);
            if (editingGameId === gameId) {
              editingGameId = null;
            }
          } else {
            expandedGameIds.add(gameId);
          }
          renderGamesTable();
        } else if (action === 'edit') {
          editingGameId = gameId;
          expandedGameIds.add(gameId);
          renderGamesTable();
        } else if (action === 'cancel') {
          editingGameId = null;
          renderGamesTable();
        } else if (action === 'update') {
          updateGame(gameId);
        } else if (action === 'archive') {
          archiveGame(gameId);
        }
      }

      async function loadGames() {
        const teamId = getCurrentTeamId();
        const newGameLink = document.getElementById('new-game-link');
        const emptyGamesLink = document.getElementById('empty-games-create-link');
        const teamNameDisplay = document.getElementById('team-name-display');
        if (newGameLink) {
          newGameLink.href = `/t${teamId}/new-game`;
        }
        if (emptyGamesLink) {
          emptyGamesLink.href = `/t${teamId}/new-game`;
        }

        const teamResponse = await fetch(`/api/teams/${teamId}`);
        let teamName = 'Default Team';
        if (teamResponse.ok) {
          const { team } = await teamResponse.json();
          if (team && team.team_name) {
            teamName = team.team_name;
          }
        }

        if (teamNameDisplay) {
          teamNameDisplay.textContent = `Team: ${teamName}`;
        }

        const response = await fetch(`/api/games?teamId=${teamId}`);
        if (!response.ok) {
          throw new Error('Unable to load games.');
        }

        const { games } = await response.json();
        const list = document.getElementById('games-list');
        const emptyState = document.getElementById('games-empty-state');

        currentGames = games;

        if (games.length === 0) {
          list.innerHTML = '';
          list.classList.add('hidden');
          emptyState.classList.remove('hidden');
          return;
        }

        list.classList.remove('hidden');
        emptyState.classList.add('hidden');
        renderGamesTable();
      }

      document.addEventListener('DOMContentLoaded', () => {
        initMenu();
        updateTeamScopedMenuLinks();
        document.getElementById('unarchive-games-btn').addEventListener('click', unarchiveGames);
        document.getElementById('games-list').addEventListener('click', handleGamesListClick);
        loadGames().catch((error) => {
          console.error(error);
        });
        refreshUnarchiveButton().catch((error) => {
          console.error(error);
        });
      });
    </script>
  </body>
</html>
