<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar page-header">
        <div class="menu-wrap">
          <button id="menu-toggle" class="hamburger-btn" type="button" aria-expanded="false" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <nav id="menu-panel" class="menu-panel hidden" aria-label="Main menu">
            <a href="/teams">Teams</a>
            <a id="roster-link" href="/t1/roster">Player Roster</a>
            <a id="games-link" href="/t1/games">Games</a>
          </nav>
        </div>
        <div>
          <p class="eyebrow">Account</p>
          <h1>Profile</h1>
        </div>
      </header>

      <main class="content-panel">
        <section class="roster-chart-card profile-fields">
          <div class="field-group">
            <label>Name</label>
            <div id="profile-name-view" class="profile-name-row">
              <p id="profile-name" class="profile-value">--</p>
              <button type="button" id="edit-name-btn" class="secondary-btn small-btn">Edit</button>
            </div>
            <div id="profile-name-edit" class="name-edit-fields hidden">
              <input id="profile-first-name-input" type="text" class="inline-input" placeholder="First name" />
              <input id="profile-last-name-input" type="text" class="inline-input" placeholder="Last name" />
              <div class="row-actions">
                <button type="button" id="cancel-name-btn" class="secondary-btn small-btn">Cancel</button>
                <button type="button" id="save-name-btn" class="primary-btn small-btn">Save</button>
              </div>
            </div>
          </div>
          <div class="field-group">
            <label>Email</label>
            <p id="profile-email" class="profile-value">--</p>
          </div>
          <div class="field-group">
            <label>Email Status</label>
            <p><span id="profile-verified" class="status-pill inactive">Unverified</span></p>
          </div>
          <div class="field-group">
            <label>Member Since</label>
            <p id="profile-created" class="profile-value">--</p>
          </div>
          <div class="field-group">
            <label for="profile-new-password">Change Password</label>
            <div class="password-update-row">
              <input id="profile-new-password" type="password" class="inline-input" placeholder="New password" minlength="6" />
              <button type="button" id="update-password-btn" class="primary-btn small-btn">Update</button>
            </div>
            <p class="field-hint">Must be at least 6 characters.</p>
            <p id="password-update-message" class="auth-message"></p>
          </div>
        </section>

        <h2>My Teams</h2>
        <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Team Name</th>
              <th>Players</th>
              <th>Games</th>
            </tr>
          </thead>
          <tbody id="profile-teams-body"></tbody>
        </table>
        </div>
        <div id="profile-teams-empty" class="empty-state hidden">
          <p>You are not a member of any teams yet.</p>
        </div>
      </main>
    </div>

    <script src="/styles.js"></script>
    <script>
      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDate(isoString) {
        if (!isoString) {
          return '--';
        }

        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) {
          return '--';
        }

        return date.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      }

      const profileState = {
        firstName: '',
        lastName: ''
      };

      async function loadProfile() {
        const response = await fetch('/api/session');
        if (!response.ok) {
          throw new Error('Unable to load profile.');
        }

        const { user } = await response.json();
        if (!user) {
          window.location.href = '/login';
          return;
        }

        profileState.firstName = user.firstName;
        profileState.lastName = user.lastName;

        const fullName = `${user.firstName} ${user.lastName}`.trim();
        document.getElementById('profile-name').textContent = fullName;
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-created').textContent = formatDate(user.createdAt);

        const verifiedEl = document.getElementById('profile-verified');
        verifiedEl.textContent = user.emailVerified ? 'Verified' : 'Unverified';
        verifiedEl.classList.toggle('active', user.emailVerified);
        verifiedEl.classList.toggle('inactive', !user.emailVerified);
      }

      function openNameEdit() {
        document.getElementById('profile-first-name-input').value = profileState.firstName;
        document.getElementById('profile-last-name-input').value = profileState.lastName;
        document.getElementById('profile-name-view').classList.add('hidden');
        document.getElementById('profile-name-edit').classList.remove('hidden');
        document.getElementById('profile-first-name-input').focus();
      }

      function closeNameEdit() {
        document.getElementById('profile-name-edit').classList.add('hidden');
        document.getElementById('profile-name-view').classList.remove('hidden');
      }

      async function saveName() {
        const firstName = document.getElementById('profile-first-name-input').value.trim();
        const lastName = document.getElementById('profile-last-name-input').value.trim();

        if (!firstName || !lastName) {
          alert('Please enter both a first and last name.');
          return;
        }

        const response = await fetch('/api/profile', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ firstName, lastName })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          alert(errorData.message || 'Unable to update name.');
          return;
        }

        const { user } = await response.json();
        profileState.firstName = user.firstName;
        profileState.lastName = user.lastName;
        document.getElementById('profile-name').textContent = `${user.firstName} ${user.lastName}`.trim();
        closeNameEdit();
      }

      function setPasswordMessage(message, type = 'error') {
        const el = document.getElementById('password-update-message');
        el.textContent = message;
        el.className = `auth-message ${type}`;
      }

      async function updatePassword() {
        const input = document.getElementById('profile-new-password');
        const password = input.value;

        if (!password.trim()) {
          setPasswordMessage('Enter a new password before updating.', 'error');
          return;
        }

        const response = await fetch('/api/profile/password', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ password })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          setPasswordMessage(data.message || 'Unable to update password.', 'error');
          return;
        }

        input.value = '';
        setPasswordMessage(data.message || 'Password updated successfully.', 'success');
      }

      async function loadProfileTeams() {
        const response = await fetch('/api/teams');
        if (!response.ok) {
          throw new Error('Unable to load teams.');
        }

        const { teams = [] } = await response.json();
        const tableBody = document.getElementById('profile-teams-body');
        const table = tableBody.closest('table');
        const emptyState = document.getElementById('profile-teams-empty');

        if (teams.length === 0) {
          table.classList.add('hidden');
          emptyState.classList.remove('hidden');
          return;
        }

        table.classList.remove('hidden');
        emptyState.classList.add('hidden');

        const sortedTeams = [...teams].sort((a, b) => String(a.teamName || '').localeCompare(String(b.teamName || '')));
        tableBody.innerHTML = sortedTeams.map((team) => `
          <tr>
            <td><a href="/t${team.id}/games">${escapeHtml(team.teamName)}</a></td>
            <td>${team.playerCount} on roster</td>
            <td>${team.gameCount} games</td>
          </tr>
        `).join('');
      }

      document.addEventListener('DOMContentLoaded', () => {
        initMenu();
        updateTeamScopedMenuLinks();

        document.getElementById('edit-name-btn').addEventListener('click', openNameEdit);
        document.getElementById('cancel-name-btn').addEventListener('click', closeNameEdit);
        document.getElementById('save-name-btn').addEventListener('click', saveName);
        document.getElementById('update-password-btn').addEventListener('click', updatePassword);

        loadProfile().catch((error) => {
          console.error(error);
        });

        loadProfileTeams().catch((error) => {
          console.error(error);
        });
      });
    </script>
  </body>
</html>
