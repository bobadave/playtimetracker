<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">Account help</p>
        <h1>Reset Password</h1>

        <form id="reset-password-form" class="auth-form">
          <input id="reset-token" name="token" type="hidden" />

          <div class="field-group">
            <label for="reset-password">New password</label>
            <input id="reset-password" name="password" type="password" placeholder="At least 6 characters" required />
          </div>

          <button type="submit" class="primary-btn">Update password</button>
        </form>

        <p class="auth-links">
          <a href="/login">Back to login</a>
        </p>
        <div id="auth-message" class="auth-message"></div>
      </div>
    </div>

    <script>
      const authMessage = document.getElementById('auth-message');
      const tokenInput = document.getElementById('reset-token');

      function setMessage(message, type = 'error') {
        authMessage.textContent = message;
        authMessage.className = `auth-message ${type}`;
      }

      const url = new URL(window.location.href);
      const token = url.searchParams.get('token') || '';
      tokenInput.value = token;

      document.getElementById('reset-password-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(event.currentTarget);
        const payload = {
          token: String(formData.get('token') || '').trim(),
          password: String(formData.get('password') || '')
        };

        if (payload.password.length < 6) {
          setMessage('Password must be at least 6 characters long.', 'error');
          return;
        }

        const response = await fetch('/api/password-reset/confirm', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          setMessage(data.message || 'Unable to reset password.', 'error');
          return;
        }

        setMessage(data.message || 'Password updated successfully.', 'success');
        window.setTimeout(() => {
          window.location.href = '/login';
        }, 1200);
      });
    </script>
  </body>
</html>
