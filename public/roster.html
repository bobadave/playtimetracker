<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Roster</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar page-header">
        <div class="menu-wrap">
          <button id="menu-toggle" class="hamburger-btn" type="button" aria-expanded="false" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <nav id="menu-panel" class="menu-panel hidden" aria-label="Main menu">
            <a href="/teams">Teams</a>
            <a id="roster-link" href="/t1/roster">Player Roster</a>
            <a id="games-link" href="/t1/games">Games</a>
          </nav>
        </div>
        <div>
          <p class="eyebrow">Team roster</p>
          <h1>Player Roster</h1>
          <div id="team-name-display" class="game-name-label">Team: --</div>
        </div>
        <div class="header-actions roster-actions">
          <button id="add-player-btn" class="primary-btn" type="button">Add Player</button>
        </div>
      </header>

      <main class="content-panel">
        <section class="roster-chart-card">
          <div class="chart-header">
            <h2>All-time Play Time Distribution</h2>
          </div>
          <div class="chart-layout">
            <div id="roster-pie-chart" class="roster-pie-chart" aria-label="Player cumulative play time by player"></div>
            <ul id="roster-chart-legend" class="chart-legend"></ul>
          </div>
        </section>

        <section class="roster-chart-card">
          <div class="chart-header">
            <h2>Average Player Time Per Game</h2>
          </div>
          <div id="roster-average-chart" class="average-chart" aria-label="Player average play time per game played"></div>
        </section>

        <section class="roster-chart-card">
          <div class="chart-header">
            <h2>All-time Goals</h2>
          </div>
          <div id="roster-goal-chart" class="goal-chart" aria-label="Player all-time goals scored"></div>
        </section>

        <section class="roster-chart-card">
          <div class="chart-header">
            <h2>Effort Leaderboard</h2>
          </div>
          <div id="roster-effort-chart" class="goal-chart" aria-label="Player all-time effort stars"></div>
        </section>

        <section class="roster-chart-card">
          <div class="chart-header">
            <h2>Spirit Leaderboard</h2>
          </div>
          <div id="roster-spirit-chart" class="goal-chart" aria-label="Player all-time spirit stars"></div>
        </section>

        <section class="roster-chart-card">
          <div class="chart-header">
            <h2>Improvement Leaderboard</h2>
          </div>
          <div id="roster-improvement-chart" class="goal-chart" aria-label="Player all-time improvement stars"></div>
        </section>

        <div class="table-scroll">
        <table id="roster-table" class="data-table data-table--fit">
          <thead>
            <tr>
              <th>
                Name
                <button type="button" class="sort-btn" data-sort-field="name" aria-label="Sort by name">
                  <span class="sort-arrow" data-sort-arrow="name">⇅</span>
                </button>
              </th>
              <th>
                Cumulative Time
                <button type="button" class="sort-btn" data-sort-field="cumulativeSeconds" aria-label="Sort by cumulative time">
                  <span class="sort-arrow" data-sort-arrow="cumulativeSeconds">⇅</span>
                </button>
              </th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="roster-body"></tbody>
        </table>
        </div>
        <div class="roster-footer">
          <button id="unarchive-btn" class="secondary-btn hidden" type="button">Unarchive Players</button>
        </div>
      </main>
    </div>

    <div id="player-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="player-modal-title">
        <div class="modal-header">
          <h2 id="player-modal-title">Add Player</h2>
          <button id="close-player-modal" class="icon-btn" type="button" aria-label="Close add player dialog">×</button>
        </div>
        <form id="player-form" class="player-form">
          <div class="field-group">
            <label for="player-first-name">First Name</label>
            <input id="player-first-name" name="firstName" type="text" required />
          </div>
          <div class="field-group">
            <label for="player-last-name">Last Name</label>
            <input id="player-last-name" name="lastName" type="text" required />
          </div>
          <div class="modal-actions">
            <button type="button" id="cancel-player-btn" class="secondary-btn">Cancel</button>
            <button type="submit" class="primary-btn">Save Player</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/styles.js"></script>
    <script>
      const state = {
        editingPlayerId: null,
        archivedCount: 0,
        currentTeamId: 1,
        players: [],
        sortField: null,
        sortDirection: 'asc'
      };

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDuration(totalSeconds) {
        const total = Math.max(0, Math.floor(Number(totalSeconds) || 0));
        const minutes = Math.floor(total / 60);
        const seconds = total % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      const CHART_PALETTE = ['#768db0', '#74a57f', '#c7ae62', '#ba7f7f', '#7f9bb8', '#8c8eb8', '#c4976d', '#8ba37d'];

      // Assigns each visible (non-archived) player a stable color by their position in the
      // roster, so the same player always gets the same color across every chart on the page —
      // regardless of the order any individual chart happens to sort or list them in.
      function getPlayerColorMap(players) {
        const visiblePlayers = players.filter((player) => !player.archive);
        return Object.fromEntries(
          visiblePlayers.map((player, index) => [player.id, CHART_PALETTE[index % CHART_PALETTE.length]])
        );
      }

      function renderRosterChart(players, colorMap) {
        const chartEl = document.getElementById('roster-pie-chart');
        const legendEl = document.getElementById('roster-chart-legend');
        const visiblePlayers = players.filter((player) => !player.archive);
        const totalSeconds = visiblePlayers.reduce((sum, player) => sum + (Number(player.cumulativeSeconds) || 0), 0);

        if (!visiblePlayers.length || totalSeconds <= 0) {
          chartEl.style.background = 'conic-gradient(#dfe7f3 0 100%)';
          legendEl.innerHTML = '<li class="chart-empty">No playing time recorded yet.</li>';
          return;
        }

        let start = 0;
        const segments = visiblePlayers.map((player) => {
          const value = Number(player.cumulativeSeconds) || 0;
          const share = value / totalSeconds;
          const end = start + share;
          const color = colorMap[player.id];
          const segment = `${color} ${start * 100}% ${end * 100}%`;
          start = end;
          return segment;
        });

        chartEl.style.background = `conic-gradient(${segments.join(', ')})`;
        legendEl.innerHTML = visiblePlayers
          .map((player) => {
            const value = Number(player.cumulativeSeconds) || 0;
            const share = totalSeconds > 0 ? (value / totalSeconds) * 100 : 0;
            const playerName = `${player.firstName} ${player.lastName}`.trim();
            return `
              <li class="chart-item">
                <span class="chart-swatch" style="background:${colorMap[player.id]};"></span>
                <span class="chart-label">${escapeHtml(playerName)}</span>
                <span class="chart-value">${share.toFixed(1)}%</span>
              </li>
            `;
          })
          .join('');
      }

      function renderLeaderboardChart(elementId, players, colorMap, valueKey, emptyMessage) {
        const chartEl = document.getElementById(elementId);
        const visiblePlayers = players.filter((player) => !player.archive);
        const maxValue = visiblePlayers.reduce((max, player) => Math.max(max, Number(player[valueKey]) || 0), 0);

        if (!visiblePlayers.length || maxValue <= 0) {
          chartEl.innerHTML = `<p class="chart-empty">${escapeHtml(emptyMessage)}</p>`;
          return;
        }

        const sortedPlayers = [...visiblePlayers].sort((a, b) => (Number(b[valueKey]) || 0) - (Number(a[valueKey]) || 0));

        chartEl.innerHTML = sortedPlayers.map((player) => {
          const value = Number(player[valueKey]) || 0;
          const widthPercent = (value / maxValue) * 100;
          const playerName = `${player.firstName} ${player.lastName}`.trim();
          const color = colorMap[player.id];

          return `
            <div class="goal-bar-row">
              <span class="goal-bar-label">${escapeHtml(playerName)}</span>
              <div class="goal-bar-track">
                <div class="goal-bar-fill" style="width: ${widthPercent}%; background: ${color};"></div>
              </div>
              <span class="goal-bar-value">${value}</span>
            </div>
          `;
        }).join('');
      }

      function renderGoalChart(players, colorMap) {
        renderLeaderboardChart('roster-goal-chart', players, colorMap, 'cumulativeGoals', 'No goals recorded yet.');
      }

      function renderEffortChart(players, colorMap) {
        renderLeaderboardChart('roster-effort-chart', players, colorMap, 'cumulativeEffort', 'No effort stars recorded yet.');
      }

      function renderSpiritChart(players, colorMap) {
        renderLeaderboardChart('roster-spirit-chart', players, colorMap, 'cumulativeSpirit', 'No spirit stars recorded yet.');
      }

      function renderImprovementChart(players, colorMap) {
        renderLeaderboardChart('roster-improvement-chart', players, colorMap, 'cumulativeImprovement', 'No improvement stars recorded yet.');
      }

      const AVERAGE_CHART_TRACK_HEIGHT = 200;
      const AVERAGE_CHART_TOP_PADDING = 28;
      const AVERAGE_CHART_NAME_FONT = '11px Arial, Helvetica, sans-serif';

      function calculateMedian(values) {
        if (!values.length) {
          return 0;
        }

        const sorted = [...values].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];
      }

      function measureTextWidth(text, font) {
        if (!measureTextWidth.ctx) {
          measureTextWidth.ctx = document.createElement('canvas').getContext('2d');
        }

        measureTextWidth.ctx.font = font;
        return measureTextWidth.ctx.measureText(text).width;
      }

      function renderAveragePlayTimeChart(players, colorMap) {
        const chartEl = document.getElementById('roster-average-chart');
        const visiblePlayers = players.filter((player) => !player.archive);
        const averages = visiblePlayers.map((player) => Number(player.averageSecondsPerGame) || 0);
        const maxAverage = Math.max(0, ...averages);

        if (!visiblePlayers.length || maxAverage <= 0) {
          chartEl.innerHTML = '<p class="chart-empty">No playing time recorded yet.</p>';
          return;
        }

        const sortedPlayers = [...visiblePlayers].sort((a, b) => (Number(b.averageSecondsPerGame) || 0) - (Number(a.averageSecondsPerGame) || 0));
        const meanAverage = averages.reduce((sum, value) => sum + value, 0) / averages.length;
        const medianAverage = calculateMedian(averages);
        const usableHeight = AVERAGE_CHART_TRACK_HEIGHT - AVERAGE_CHART_TOP_PADDING;

        const barsHtml = sortedPlayers.map((player) => {
          const average = Number(player.averageSecondsPerGame) || 0;
          const heightPx = Math.max(4, (average / maxAverage) * usableHeight);
          const color = colorMap[player.id];

          return `
            <div class="average-chart-bar-wrap">
              <div class="average-chart-bar" style="height: ${heightPx}px; background: ${color};">
                <span class="average-chart-value">${formatDuration(average)}</span>
              </div>
            </div>
          `;
        }).join('');

        const namesHtml = sortedPlayers.map((player) => {
          const playerName = `${player.firstName} ${player.lastName}`.trim();
          return `
            <div class="average-chart-name-wrap">
              <span class="average-chart-name">${escapeHtml(playerName)}</span>
            </div>
          `;
        }).join('');

        const meanBottomPx = Math.min(usableHeight, (meanAverage / maxAverage) * usableHeight);
        const medianBottomPx = Math.min(usableHeight, (medianAverage / maxAverage) * usableHeight);

        const longestNameWidth = Math.max(
          0,
          ...sortedPlayers.map((player) => measureTextWidth(`${player.firstName} ${player.lastName}`.trim(), AVERAGE_CHART_NAME_FONT))
        );
        const nameAreaHeight = Math.ceil(longestNameWidth * Math.sin(Math.PI / 4) + 20);

        chartEl.innerHTML = `
          <div class="average-chart-legend">
            <span class="average-chart-legend-item average-chart-legend-item--mean">
              <span class="average-chart-legend-swatch"></span>
              Mean <span class="average-chart-legend-value">${formatDuration(meanAverage)}</span>
            </span>
            <span class="average-chart-legend-item average-chart-legend-item--median">
              <span class="average-chart-legend-swatch"></span>
              Median <span class="average-chart-legend-value">${formatDuration(medianAverage)}</span>
            </span>
          </div>
          <div class="average-chart-plot" style="height: ${AVERAGE_CHART_TRACK_HEIGHT}px;">
            <div class="average-chart-line average-chart-line--mean" style="bottom: ${meanBottomPx}px;"></div>
            <div class="average-chart-line average-chart-line--median" style="bottom: ${medianBottomPx}px;"></div>
            <div class="average-chart-bars">${barsHtml}</div>
          </div>
          <div class="average-chart-names" style="height: ${nameAreaHeight}px;">${namesHtml}</div>
        `;
      }

      function renderTeamName(teamName) {
        const teamNameDisplay = document.getElementById('team-name-display');
        if (teamNameDisplay) {
          teamNameDisplay.textContent = `Team: ${teamName || 'Default Team'}`;
        }
      }

      async function loadTeams() {
        const response = await fetch('/api/teams');
        if (!response.ok) {
          throw new Error('Unable to load teams.');
        }

        const { teams } = await response.json();
        const pathTeamId = getTeamIdFromPath();
        const selectedTeamId = Number(pathTeamId ?? state.currentTeamId ?? teams[0]?.id ?? 1);
        state.currentTeamId = Number.isFinite(selectedTeamId) ? selectedTeamId : 1;
        const selectedTeam = teams.find((team) => Number(team.id) === Number(state.currentTeamId)) || teams[0];

        if (selectedTeam) {
          state.currentTeamId = Number(selectedTeam.id);
          renderTeamName(selectedTeam.teamName);
        }
      }

      function sortPlayers(players) {
        const { sortField, sortDirection } = state;
        if (!sortField) {
          return players;
        }

        const direction = sortDirection === 'desc' ? -1 : 1;

        return [...players].sort((a, b) => {
          if (sortField === 'cumulativeSeconds') {
            const aValue = Number(a.cumulativeSeconds) || 0;
            const bValue = Number(b.cumulativeSeconds) || 0;
            return (aValue - bValue) * direction;
          }

          const aValue = sortField === 'name'
            ? `${a.firstName || ''} ${a.lastName || ''}`.trim().toLowerCase()
            : String(a[sortField] || '').toLowerCase();
          const bValue = sortField === 'name'
            ? `${b.firstName || ''} ${b.lastName || ''}`.trim().toLowerCase()
            : String(b[sortField] || '').toLowerCase();
          if (aValue < bValue) return -1 * direction;
          if (aValue > bValue) return 1 * direction;
          return 0;
        });
      }

      function updateSortIndicators() {
        document.querySelectorAll('.sort-arrow').forEach((arrowEl) => {
          const field = arrowEl.dataset.sortArrow;
          if (state.sortField !== field) {
            arrowEl.textContent = '⇅';
            arrowEl.classList.remove('active');
            return;
          }

          arrowEl.textContent = state.sortDirection === 'asc' ? '▲' : '▼';
          arrowEl.classList.add('active');
        });
      }

      function renderRoster(players) {
        const tbody = document.getElementById('roster-body');
        const unarchiveBtn = document.getElementById('unarchive-btn');
        const visiblePlayers = sortPlayers(players.filter((player) => !player.archive));
        const archivedPlayers = players.filter((player) => player.archive);

        state.archivedCount = archivedPlayers.length;
        unarchiveBtn.classList.toggle('hidden', archivedPlayers.length === 0);
        const colorMap = getPlayerColorMap(players);
        renderRosterChart(players, colorMap);
        renderGoalChart(players, colorMap);
        renderEffortChart(players, colorMap);
        renderSpiritChart(players, colorMap);
        renderImprovementChart(players, colorMap);
        renderAveragePlayTimeChart(players, colorMap);
        updateSortIndicators();

        tbody.innerHTML = visiblePlayers.map((player) => {
          const editing = Number(state.editingPlayerId) === Number(player.id);

          const nameCell = editing
            ? `
              <div class="name-edit-fields">
                <input class="inline-input" data-field="firstName" placeholder="First" value="${escapeHtml(player.firstName)}" />
                <input class="inline-input" data-field="lastName" placeholder="Last" value="${escapeHtml(player.lastName)}" />
              </div>
            `
            : escapeHtml(`${player.firstName} ${player.lastName}`.trim());

          return `
            <tr>
              <td>${nameCell}</td>
              <td>${formatDuration(player.cumulativeSeconds ?? player.totalSeconds)}</td>
              <td class="row-actions">
                ${editing
                  ? `<button type="button" class="primary-btn small-btn" data-action="update" data-player-id="${player.id}">Update</button>
                     <button type="button" class="danger-btn small-btn" data-action="delete" data-player-id="${player.id}">Delete</button>`
                  : `<button type="button" class="secondary-btn small-btn" data-action="edit" data-player-id="${player.id}">Edit</button>`}
              </td>
            </tr>
          `;
        }).join('');
      }

      async function loadRoster() {
        const response = await fetch(`/api/players?includeArchived=true&teamId=${state.currentTeamId}`);
        if (!response.ok) {
          throw new Error('Unable to load roster.');
        }

        const players = await response.json();
        state.players = players;
        renderRoster(players);
      }

      function setSortField(field) {
        if (state.sortField === field) {
          state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortField = field;
          state.sortDirection = 'asc';
        }

        renderRoster(state.players);
      }

      async function updatePlayer(playerId, payload) {
        const response = await fetch(`/api/players/${playerId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.message || 'Unable to update player.');
        }
      }

      async function archivePlayer(playerId) {
        await updatePlayer(playerId, { archive: true });
      }

      async function unarchivePlayers() {
        const response = await fetch('/api/players/unarchive', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ teamId: state.currentTeamId })
        });
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.message || 'Unable to unarchive players.');
        }

        state.editingPlayerId = null;
        await loadRoster();
      }

      function openPlayerModal() {
        const modal = document.getElementById('player-modal');
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
        document.getElementById('player-first-name').focus();
      }

      function closePlayerModal() {
        const modal = document.getElementById('player-modal');
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
        const form = document.getElementById('player-form');
        form.reset();
      }

      async function handleAddPlayer(event) {
        event.preventDefault();

        const form = event.currentTarget;
        const formData = new FormData(form);
        const payload = {
          firstName: String(formData.get('firstName') || '').trim(),
          lastName: String(formData.get('lastName') || '').trim(),
          teamId: state.currentTeamId
        };

        if (!payload.firstName || !payload.lastName) {
          alert('Please enter both a first and last name.');
          return;
        }

        const response = await fetch('/api/players', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          alert(errorData.message || 'Unable to add player.');
          return;
        }

        closePlayerModal();
        await loadRoster();
      }

      async function handleRosterAction(event) {
        const button = event.target.closest('button[data-action]');
        if (!button) {
          return;
        }

        const playerId = Number(button.dataset.playerId);
        const action = button.dataset.action;

        if (action === 'edit') {
          state.editingPlayerId = playerId;
          await loadRoster();
          return;
        }

        if (action === 'update') {
          const row = button.closest('tr');
          const firstName = row.querySelector('[data-field="firstName"]').value.trim();
          const lastName = row.querySelector('[data-field="lastName"]').value.trim();

          if (!firstName || !lastName) {
            alert('First name and last name cannot be empty.');
            return;
          }

          try {
            await updatePlayer(playerId, { firstName, lastName });
            state.editingPlayerId = null;
            await loadRoster();
          } catch (error) {
            alert(error.message);
          }
          return;
        }

        if (action === 'delete') {
          try {
            await archivePlayer(playerId);
            state.editingPlayerId = null;
            await loadRoster();
          } catch (error) {
            alert(error.message);
          }
        }
      }

      function getTeamIdFromPath() {
        const match = window.location.pathname.match(/^\/t(\d+)\/roster$/);
        return match ? Number(match[1]) : null;
      }

      async function updateTeamRoster(teamId) {
        state.currentTeamId = Number(teamId) || 1;
        const teamResponse = await fetch(`/api/teams/${state.currentTeamId}`);
        if (teamResponse.ok) {
          const { team } = await teamResponse.json();
          renderTeamName(team ? team.team_name : 'Default Team');
        }

        const nextPath = `/t${state.currentTeamId}/roster`;
        if (window.location.pathname !== nextPath) {
          window.history.replaceState({}, '', nextPath);
        }

        await loadRoster();
      }

      document.addEventListener('DOMContentLoaded', () => {
        initMenu();
        document.getElementById('add-player-btn').addEventListener('click', openPlayerModal);
        document.getElementById('close-player-modal').addEventListener('click', closePlayerModal);
        document.getElementById('cancel-player-btn').addEventListener('click', closePlayerModal);
        document.getElementById('player-form').addEventListener('submit', handleAddPlayer);
        document.getElementById('player-modal').addEventListener('click', (event) => {
          if (event.target.dataset.closeModal === 'true') {
            closePlayerModal();
          }
        });
        document.getElementById('roster-body').addEventListener('click', handleRosterAction);
        document.querySelectorAll('.sort-btn').forEach((button) => {
          button.addEventListener('click', () => setSortField(button.dataset.sortField));
        });
        document.getElementById('unarchive-btn').addEventListener('click', async () => {
          try {
            await unarchivePlayers();
          } catch (error) {
            alert(error.message);
          }
        });

        loadTeams()
          .then(() => loadRoster())
          .catch((error) => {
            console.error(error);
          });
      });
    </script>
  </body>
</html>
