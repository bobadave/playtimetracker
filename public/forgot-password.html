<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">Account help</p>
        <h1>Forgot Password</h1>

        <form id="forgot-password-form" class="auth-form">
          <div class="field-group">
            <label for="forgot-email">Email</label>
            <input id="forgot-email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <button type="submit" class="primary-btn">Send reset link</button>
        </form>

        <p class="auth-links">
          <a href="/login">Back to login</a>
        </p>
        <div id="auth-message" class="auth-message"></div>
      </div>
    </div>

    <script src="/styles.js"></script>
    <script>
      const authMessage = document.getElementById('auth-message');

      function setMessage(message, type = 'error') {
        authMessage.textContent = message;
        authMessage.className = `auth-message ${type}`;
      }

      document.getElementById('forgot-password-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(event.currentTarget);
        const payload = {
          email: String(formData.get('email') || '').trim().toLowerCase()
        };

        const response = await fetch('/api/password-reset/request', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          setMessage(data.message || 'Unable to request a password reset.', 'error');
          return;
        }

        setMessage(data.message || 'If an account exists, a reset link has been sent.', 'success');
      });
    </script>
  </body>
</html>
