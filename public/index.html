<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soccer Game Time Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="menu-wrap">
          <button id="menu-toggle" class="hamburger-btn" type="button" aria-expanded="false" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <nav id="menu-panel" class="menu-panel hidden" aria-label="Main menu">
            <a href="/teams">Teams</a>
            <a id="roster-link" href="/t1/roster">Player Roster</a>
            <a id="games-link" href="/t1/games">Games</a>
          </nav>
        </div>

        <div>
          <p class="eyebrow">Soccer game tracker</p>
          <h1>Player Time</h1>
          <div id="game-name-display" class="game-name-label">Game: --</div>
          <div id="team-name-display" class="game-name-label">Team: --</div>
          <div id="game-id-display" class="game-id-label">Game ID: --</div>
          <div id="game-meta-display" class="game-meta-label">Location: --</div>
        </div>
        <div class="header-actions"></div>
      </header>

      <main class="layout">
        <aside class="panel roster-panel">
          <div class="panel-header">
            <h2>Bench</h2>
          </div>
          <div id="player-list" class="player-list" aria-live="polite"></div>
        </aside>

        <section class="panel stage-panel">
          <div class="panel-header stage-header">
            <div class="stage-header-left">
              <h2>On Field</h2>
              <button id="game-toggle-btn" class="game-toggle-btn" type="button">Game End</button>
              <button id="end-quarter-btn" class="end-quarter-btn" type="button" hidden>End Quarter</button>
              <div id="game-countdown-wrap" class="game-countdown-wrap" hidden>
                <span class="game-countdown-label">Time left</span>
                <span id="game-countdown" class="game-countdown"></span>
              </div>
            </div>
          </div>
          <div id="scoreboard" class="scoreboard hidden" aria-live="polite"></div>
          <div id="stage" class="stage" aria-label="Game stage">
            <div class="empty-state">Drop players on to field to track play time.</div>
          </div>
          <div id="quarter-progress" class="quarter-progress" aria-label="Quarter progress"></div>
        </section>
      </main>
    </div>

    <div id="goal-popup" class="popup-overlay goal-popup" aria-live="assertive">GOOOOAAALL!!!</div>

    <div id="stars-explosion" class="stars-explosion" aria-hidden="true"></div>

    <div id="confirm-popup" class="popup-overlay confirm-popup" role="alertdialog" aria-modal="true" aria-live="assertive">
      <p id="confirm-popup-message" class="confirm-popup-message"></p>
      <div class="confirm-popup-actions">
        <button type="button" id="confirm-popup-yes" class="confirm-btn confirm-yes">Yes</button>
        <button type="button" id="confirm-popup-no" class="confirm-btn confirm-no">No</button>
      </div>
    </div>

    <div id="stars-popup" class="popup-overlay confirm-popup stars-popup" role="alertdialog" aria-modal="true" aria-live="assertive">
      <p id="stars-popup-message" class="confirm-popup-message"></p>
      <div class="stars-popup-fields">
        <label class="stars-popup-field">
          <span class="stars-popup-field-label">Action</span>
          <select id="stars-popup-action" class="stars-popup-select">
            <option value="" selected>Select</option>
            <option value="effort">Effort</option>
            <option value="spirit">Spirit</option>
            <option value="improvement">Improvement</option>
          </select>
        </label>
        <label class="stars-popup-field">
          <span class="stars-popup-field-label">Stars</span>
          <select id="stars-popup-stars" class="stars-popup-select stars-popup-select-stars">
            <option value="1">★☆☆☆☆</option>
            <option value="2">★★☆☆☆</option>
            <option value="3">★★★☆☆</option>
            <option value="4">★★★★☆</option>
            <option value="5">★★★★★</option>
          </select>
        </label>
      </div>
      <p id="stars-popup-error" class="stars-popup-error hidden">Please select an action.</p>
      <div class="confirm-popup-actions">
        <button type="button" id="stars-popup-submit" class="confirm-btn confirm-yes">Log Stars</button>
        <button type="button" id="stars-popup-cancel" class="confirm-btn confirm-no">Cancel</button>
      </div>
    </div>

    <script src="/styles.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
