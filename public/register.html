<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">Create account</p>
        <h1>Register</h1>

        <form id="register-form" class="auth-form">
          <div class="field-group">
            <label for="register-first-name">First Name</label>
            <input id="register-first-name" name="firstName" type="text" placeholder="First name" required />
          </div>

          <div class="field-group">
            <label for="register-last-name">Last Name</label>
            <input id="register-last-name" name="lastName" type="text" placeholder="Last name" required />
          </div>

          <div class="field-group">
            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field-group">
            <label for="register-password">Password</label>
            <input id="register-password" name="password" type="password" placeholder="At least 6 characters" required />
          </div>

          <button type="submit" class="primary-btn">Create account</button>
        </form>

        <p class="auth-links">
          Already have an account? <a href="/login">Login</a>
        </p>
        <p class="auth-links">
          Forgot your password? <a href="/forgot-password">Reset it</a>
        </p>
        <div id="auth-message" class="auth-message"></div>
      </div>
    </div>

    <script src="/styles.js"></script>
    <script>
      const authMessage = document.getElementById('auth-message');

      function setMessage(message, type = 'error') {
        authMessage.textContent = message;
        authMessage.className = `auth-message ${type}`;
      }

      window.sessionStorage.removeItem('currentTeamId');

      document.getElementById('register-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(event.currentTarget);
        const payload = {
          firstName: String(formData.get('firstName') || '').trim(),
          lastName: String(formData.get('lastName') || '').trim(),
          email: String(formData.get('email') || '').trim(),
          password: String(formData.get('password') || '')
        };

        if (payload.password.length < 6) {
          setMessage('Password must be at least 6 characters long.', 'error');
          return;
        }

        window.sessionStorage.removeItem('currentTeamId');

        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          setMessage(data.message || 'Unable to register.', 'error');
          return;
        }

        window.sessionStorage.setItem('authMessage', data.message || 'Registration successful. Please verify your email before logging in.');
        window.location.href = '/login';
      });
    </script>
  </body>
</html>
